services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: nexvion-app:local
    container_name: nexvion-app
    restart: unless-stopped
    networks:
      - nexvion-net

  proxy:
    image: nginx:1.27-alpine
    container_name: nexvion-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy-logs:/var/log/nginx
    networks:
      - nexvion-net

networks:
  nexvion-net:
    driver: bridge

volumes:
  proxy-logs:
