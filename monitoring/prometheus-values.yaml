alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  retention: 24h
  global:
    scrape_interval: 30s
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 96Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 16Mi
    limits:
      memory: 64Mi
