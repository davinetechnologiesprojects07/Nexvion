name: Nexvion CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  docker-build-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexvion:ci .

      - name: Start Nexvion container
        run: |
          docker run -d \
            --name nexvion-ci \
            -p 8080:80 \
            nexvion:ci

      - name: Wait for container health
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nexvion-ci 2>/dev/null || true)

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          echo "Container did not become healthy"
          docker logs nexvion-ci
          exit 1

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:8080/health

      - name: Test application
        run: |
          curl --fail --head http://localhost:8080

      - name: Cleanup
        if: always()
        run: |
          docker stop nexvion-ci || true
          docker rm nexvion-ci || true