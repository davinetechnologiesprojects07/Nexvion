replicaCount: 2

image:
  repository: richieit/nexvion
  tag: "1"
  pullPolicy: IfNotPresent

config:
  APP_ENV: staging
  APP_NAME: Nexvion

# Secret is created outside the chart (kubectl) so no secret value lives in Git
existingSecret: nexvion-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: nexvion.local

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
